name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Perft (quick)
        run: ./build/perft_test --quick
      - name: UCI smoke test
        run: bash tests/uci_smoke.sh ./build/tsurugi
      - name: Bench
        run: ./build/tsurugi bench 8
