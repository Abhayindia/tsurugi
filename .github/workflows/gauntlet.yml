name: gauntlet
run-name: gauntlet ${{ inputs.run_tag }}

# Tsurugi against Stockfish at fixed UCI_Elo levels (UCI_LimitStrength). tools/gauntlet.py dispatches this,
# sums the per-level results from the artifacts and fits a rating with error bars.
on:
  workflow_dispatch:
    inputs:
      run_tag: {description: "unique name of this run", required: true}
      ref: {description: "commit of the engine", required: true}
      opts: {description: "UCI options for Tsurugi, space separated Name=value", default: ""}
      elos: {description: "JSON array of Stockfish UCI_Elo levels", default: "[1800,2100,2400,2700,3000]"}
      shards: {description: "JSON array of shard numbers per level", default: "[1,2]"}
      pairs: {description: "game pairs per shard", default: "100"}
      tc: {description: "time control", default: "10+0.1"}
      seed_offset: {description: "added to the shard number to seed the opening order", default: "0"}
      net: {description: "network in the repo placed next to the binary (empty for none)", default: "nets/tsurugi-v3.nnue"}

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        elo: ${{ fromJSON(inputs.elos) }}
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref }}", path: engine}
      - name: Build engine
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release -DTSURUGI_NATIVE=OFF > /dev/null
          cmake --build engine/build -j"$(nproc)" --target tsurugi > /dev/null
          net="${{ inputs.net }}"
          if [ -n "$net" ] && [ -f "engine/$net" ]; then cp "engine/$net" engine/build/tsurugi.nnue; fi
      - uses: actions/cache@v4
        id: fc
        with: {path: fastchess/fastchess, key: fastchess-ebfd64c}
      - name: Build fastchess
        if: steps.fc.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/Disservin/fastchess.git && git -C fastchess checkout -q ebfd64c
          make -C fastchess -j"$(nproc)" > /dev/null
      - uses: actions/cache@v4
        id: sf
        with: {path: stockfish/stockfish-ubuntu-x86-64-avx2, key: stockfish-sf_17.1-avx2}
      - name: Fetch Stockfish
        if: steps.sf.outputs.cache-hit != 'true'
        run: |
          curl -sL -o sf.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-ubuntu-x86-64-avx2.tar
          tar -xf sf.tar
      - uses: actions/cache@v4
        id: book
        with: {path: UHO_Lichess_4852_v1.epd, key: book-uho-4852-v1}
      - name: Fetch book
        if: steps.book.outputs.cache-hit != 'true'
        run: |
          curl -sL -o book.zip https://github.com/official-stockfish/books/raw/master/UHO_Lichess_4852_v1.epd.zip
          unzip -q book.zip
      - name: Play
        run: |
          opts() { for o in $1; do printf ' option.%s' "$o"; done; }
          seed=$(( ${{ inputs.seed_offset }} + ${{ matrix.elo }} + ${{ matrix.shard }} ))
          ./fastchess/fastchess \
            -engine cmd=engine/build/tsurugi name=tsurugi $(opts "${{ inputs.opts }}") option.Hash=16 \
            -engine cmd=stockfish/stockfish-ubuntu-x86-64-avx2 name=sf${{ matrix.elo }} option.Hash=16 \
              option.Threads=1 option.UCI_LimitStrength=true option.UCI_Elo=${{ matrix.elo }} \
            -each tc=${{ inputs.tc }} proto=uci \
            -openings file=UHO_Lichess_4852_v1.epd format=epd order=random -srand $seed \
            -repeat -games 2 -rounds ${{ inputs.pairs }} -concurrency "$(nproc)" -recover \
            -ratinginterval 1000000 > games.log 2>&1 || true
          tail -20 games.log
          { echo "elo ${{ matrix.elo }}"
            grep -E "^Games: " games.log | tail -1
            echo "timeouts $(grep -ciE 'tsurugi loses on time' games.log || true)"; } > result.txt
          cat result.txt
          grep -q "^Games: " result.txt
      - uses: actions/upload-artifact@v4
        with: {name: "result-${{ matrix.elo }}-${{ matrix.shard }}", path: result.txt, retention-days: 30}
