name: sprt
run-name: sprt ${{ inputs.run_tag }}

# One batch of an SPRT split into parallel shards. tools/gh_sprt.py dispatches batches, sums the pentanomial
# counts from the artifacts and stops when the LLR crosses a bound.
on:
  workflow_dispatch:
    inputs:
      run_tag: {description: "unique name of this batch", required: true}
      new_ref: {description: "commit of the new engine", required: true}
      base_ref: {description: "commit of the base engine", required: true}
      new_opts: {description: "UCI options for new, space separated Name=value", default: ""}
      base_opts: {description: "UCI options for base", default: ""}
      tc: {description: "time control", default: "8+0.08"}
      pairs: {description: "game pairs per shard", default: "100"}
      shards: {description: "JSON array of shard numbers", default: "[1,2,3,4,5,6,7,8]"}
      seed_offset: {description: "added to the shard number to seed the opening order", default: "0"}
      net: {description: "network in the repo placed next to both binaries (empty for none)", default: "nets/tsurugi-v10.nnue"}
      new_net: {description: "network for the new engine only (empty: same as net)", default: ""}

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.new_ref }}", path: new}
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.base_ref }}", path: base}
      - name: Build engines
        run: |
          for e in new base; do
            net="${{ inputs.net }}"
            if [ $e = new ] && [ -n "${{ inputs.new_net }}" ]; then net="${{ inputs.new_net }}"; fi
            cmake -S $e -B $e/build -DCMAKE_BUILD_TYPE=Release -DTSURUGI_NATIVE=ON -DTSURUGI_USE_PEXT=OFF > /dev/null
            cmake --build $e/build -j"$(nproc)" --target tsurugi > /dev/null
            if [ -n "$net" ] && [ -f "$e/$net" ]; then cp "$e/$net" $e/build/tsurugi.nnue; fi
          done
      - uses: actions/cache@v4
        id: fc
        with: {path: fastchess/fastchess, key: fastchess-ebfd64c}
      - name: Build fastchess
        if: steps.fc.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/Disservin/fastchess.git && git -C fastchess checkout -q ebfd64c
          make -C fastchess -j"$(nproc)" > /dev/null
      - uses: actions/cache@v4
        id: book
        with: {path: UHO_Lichess_4852_v1.epd, key: book-uho-4852-v1}
      - name: Fetch book
        if: steps.book.outputs.cache-hit != 'true'
        run: |
          curl -sL -o book.zip https://github.com/official-stockfish/books/raw/master/UHO_Lichess_4852_v1.epd.zip
          unzip -q book.zip
      - name: Play
        run: |
          opts() { for o in $1; do printf ' option.%s' "$o"; done; }
          seed=$(( ${{ inputs.seed_offset }} + ${{ matrix.shard }} ))
          ./fastchess/fastchess \
            -engine cmd=new/build/tsurugi name=new $(opts "${{ inputs.new_opts }}") option.Hash=16 \
            -engine cmd=base/build/tsurugi name=base $(opts "${{ inputs.base_opts }}") option.Hash=16 \
            -each tc=${{ inputs.tc }} proto=uci \
            -openings file=UHO_Lichess_4852_v1.epd format=epd order=random -srand $seed \
            -repeat -games 2 -rounds ${{ inputs.pairs }} -concurrency "$(nproc)" -recover \
            -ratinginterval 1000000 > games.log 2>&1 || true
          tail -20 games.log
          grep -E "Ptnml\(0-2\)" games.log | tail -1 > ptnml.txt
          grep -ciE "loses on time|timeout" games.log >> ptnml.txt || true
          test -s ptnml.txt
      - uses: actions/upload-artifact@v4
        with: {name: "ptnml-${{ matrix.shard }}", path: ptnml.txt, retention-days: 7}
